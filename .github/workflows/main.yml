name: Windows-RDP

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Download and Extract Ngrok
      run: |
        Invoke-WebRequest -Uri "https://equinox.io" -OutFile "ngrok.zip"
        Expand-Archive -Path "ngrok.zip" -DestinationPath "."
        
    - name: Authenticate and Start Ngrok Tunnel
      run: |
        .\ngrok.exe authtoken "${{ secrets.NGROK_AUTH_TOKEN }}"
        Start-Process .\ngrok.exe -ArgumentList "tcp 3389"
        
    - name: Enable Windows Remote Desktop (RDP)
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
        
    - name: Get RDP Address and Keep Alive
      run: |
        Start-Sleep -Seconds 15
        $Endpoint = Invoke-RestMethod -Uri "http://localhost:4040/api/tunnels"
        $Address = $Endpoint.tunnels.public_url
        Write-Host "=========================================="
        Write-Host "RDP Address: $Address"
        Write-Host "Username: Administrator"
        Write-Host "Password: Password123!"
        Write-Host "=========================================="
        Start-Sleep -Seconds 21600
