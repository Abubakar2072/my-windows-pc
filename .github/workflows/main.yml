name: Windows-RDP

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Start Ngrok Tunnel and RDP
      uses: ammar-said/windows-rdp-action@master
      env:
        NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        
    - name: Keep Alive
      run: Start-Sleep -Seconds 21600
