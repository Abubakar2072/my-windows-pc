name: Windows-RDP

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Download and Install Ngrok
      run: |
        Invoke-WebRequest https://equinox.io -OutFile ngrok.zip
        Expand-Archive ngrok.zip
        
    - name: Connect Ngrok Account
      run: |
        .\ngrok\ngrok.exe authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
        Start-Process .\ngrok\ngrok.exe -ArgumentList "tcp 3389"
        
    - name: Enable Remote Desktop (RDP)
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
        
    - name: Get RDP Address and Keep Alive
      run: |
        $Endpoint = Invoke-RestMethod -Uri "http://localhost:4040/api/tunnels"
        $Address = $Endpoint.tunnels.public_url
        Write-Host "=========================================="
        Write-Host "RDP Address: $Address"
        Write-Host "Username: Administrator"
        Write-Host "Password: Password123!"
        Write-Host "=========================================="
        Start-Sleep -Seconds 21600
